<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>日本旅宿精選地圖</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="preconnect" href="https://tile.openstreetmap.org" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --ink: #17324d;
      --ink-muted: #5f6f7d;
      --paper: #f7f5ef;
      --paper-deep: #ece8dc;
      --white: #fffefa;
      --vermilion: #d94f3d;
      --forest: #247a68;
      --gold: #c99a43;
      --line: #d9d4c8;
      --shadow: 0 18px 54px rgba(23, 50, 77, .18);
      --sidebar-normal-width: 410px;
      --sidebar-index-width: 540px;
      --sidebar-mobile-normal-height: 48vh;
      --sidebar-mobile-index-height: 78vh;
      --panel-motion: 220ms cubic-bezier(.2,.8,.2,1);
      --display: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
      --body: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", "Noto Sans TC", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; color: var(--ink); background: #dce4e5; font-family: var(--body); }
    button, input, select { font: inherit; }
    button, input, select, a { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 3px solid rgba(201, 154, 67, .75); outline-offset: 2px; }
    .app { position: relative; width: 100%; height: 100%; }
    #map { position: absolute; inset: 0; background: #dbe3df; }
    .sidebar {
      position: absolute; z-index: 700; top: 16px; bottom: 16px; left: 16px;
      display: flex; flex-direction: column; width: min(var(--sidebar-normal-width), calc(100vw - 32px));
      overflow: hidden; border: 1px solid rgba(23, 50, 77, .14); border-radius: 6px;
      background: rgba(247, 245, 239, .97); box-shadow: var(--shadow); backdrop-filter: blur(12px);
      transform: translateX(0); transition: width var(--panel-motion), height var(--panel-motion), transform var(--panel-motion), opacity var(--panel-motion);
    }
    .sidebar::before {
      position: absolute; z-index: 2; top: 0; bottom: 0; left: 0; width: 5px;
      content: ""; background: linear-gradient(var(--vermilion) 0 50%, var(--forest) 50% 100%);
    }
    .masthead { padding: 21px 22px 16px 27px; border-bottom: 1px solid var(--line); }
    .masthead-top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
    .masthead-top > div { min-width: 0; }
    .icon-control, #toggleIndexMode, .summary-toggle, #openSidebar {
      min-width: 46px; min-height: 46px; border: 1px solid rgba(23,50,77,.28); border-radius: 4px;
      color: var(--ink); background: var(--white); cursor: pointer; font-weight: 800;
    }
    .icon-control { display: grid; flex: 0 0 46px; padding: 0; place-items: center; }
    .icon-control span { margin-top: -4px; font: 400 34px/1 var(--display); }
    .eyebrow { margin: 0 0 7px; color: var(--vermilion); font-size: 11px; font-weight: 800; letter-spacing: .19em; }
    h1 { margin: 0; font-family: var(--display); font-size: clamp(25px, 2.4vw, 32px); font-weight: 700; letter-spacing: .04em; line-height: 1.14; }
    .sub { max-width: 32em; margin: 9px 0 0; color: var(--ink-muted); font-size: 12px; line-height: 1.7; }
    .filter-summary-bar { display: none; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 16px 9px 22px; border-bottom: 1px solid var(--line); background: var(--paper-deep); }
    .filter-summary-bar > div { min-width: 0; }
    .summary-kicker { display: block; margin-bottom: 2px; color: var(--ink-muted); font-size: 9px; font-weight: 800; letter-spacing: .12em; }
    #filterSummary { display: block; overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .summary-toggle { flex: 0 0 auto; padding: 0 12px; font-size: 11px; }
    .control-zone { max-height: 430px; padding: 14px 18px 13px 23px; overflow: hidden; border-bottom: 1px solid var(--line); background: rgba(255, 254, 250, .72); opacity: 1; transition: max-height var(--panel-motion), padding var(--panel-motion), opacity var(--panel-motion); }
    .section-title { margin: 0 0 9px; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    #datasetControls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .dataset-toggle { position: relative; display: block; cursor: pointer; }
    .dataset-toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .dataset-card {
      display: grid; grid-template-columns: 9px 1fr auto; align-items: center; min-height: 44px; padding: 8px 10px;
      border: 1px solid var(--line); border-radius: 4px; background: var(--paper); transition: .16s ease;
    }
    .dataset-toggle input:checked + .dataset-card { border-color: var(--dataset-color); background: var(--white); box-shadow: inset 0 0 0 1px var(--dataset-color); }
    .dataset-toggle input:focus-visible + .dataset-card { outline: 3px solid rgba(201, 154, 67, .75); outline-offset: 2px; }
    .dataset-dot { width: 8px; height: 24px; border-radius: 10px; background: var(--dataset-color); opacity: .35; }
    .dataset-toggle input:checked + .dataset-card .dataset-dot { opacity: 1; }
    .dataset-name { margin-left: 8px; font-size: 12px; font-weight: 800; }
    .dataset-count { color: var(--ink-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .notice { min-height: 16px; margin: 5px 0 -3px; color: var(--vermilion); font-size: 11px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); margin: 0 0 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper-deep); }
    .stat { padding: 8px 5px 7px; text-align: center; }
    .stat + .stat { border-left: 1px solid var(--line); }
    .stat b { display: block; font-family: var(--display); font-size: 19px; font-variant-numeric: tabular-nums; line-height: 1; }
    .stat span { display: block; margin-top: 4px; color: var(--ink-muted); font-size: 9px; letter-spacing: .04em; }
    .filters { display: grid; gap: 8px; }
    .field-label { display: block; color: var(--ink-muted); font-size: 10px; font-weight: 700; letter-spacing: .08em; }
    .field-label input, .field-label select {
      width: 100%; height: 39px; margin-top: 4px; padding: 0 11px; border: 1px solid #c9c5ba; border-radius: 3px;
      color: var(--ink); background: var(--white); font-size: 13px;
    }
    .filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .rank-filters { display: flex; gap: 6px; align-items: center; }
    .rank-label { margin-right: auto; color: var(--ink-muted); font-size: 10px; font-weight: 700; }
    .rank-filters button {
      min-height: 31px; padding: 0 9px; border: 1px solid var(--line); border-radius: 3px; color: var(--ink); background: transparent;
      cursor: pointer; font-size: 11px; font-weight: 700;
    }
    .rank-filters button.active { border-color: var(--vermilion); color: white; background: var(--vermilion); }
    .results { display: flex; flex: 1; min-height: 0; flex-direction: column; }
    .result-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 55px; padding: 7px 12px 7px 23px; border-bottom: 1px solid var(--line); }
    .result-head h2 { margin: 0; font-size: 12px; letter-spacing: .1em; }
    .result-actions { display: flex; align-items: center; gap: 9px; }
    #toggleIndexMode { min-height: 46px; padding: 0 11px; font-size: 11px; }
    #resultSummary { color: var(--ink-muted); font-size: 11px; }
    .result-list { flex: 1; overflow: auto; padding: 8px 12px 14px 17px; scrollbar-color: #b8b2a4 transparent; scrollbar-width: thin; }
    .result-card {
      display: block; width: 100%; margin: 0 0 7px; padding: 11px 12px; border: 1px solid transparent; border-radius: 4px;
      color: inherit; background: rgba(255, 254, 250, .66); cursor: pointer; text-align: left; transition: .16s ease;
    }
    .result-card:hover { border-color: #c8c1b2; background: var(--white); transform: translateX(2px); }
    .result-card.active { border-color: var(--ink); background: var(--white); box-shadow: inset 4px 0 0 var(--gold); }
    .card-top { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
    .card-name { margin: 0; font-family: var(--display); font-size: 15px; line-height: 1.35; }
    .badges { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
    .badge { padding: 2px 5px; border-radius: 2px; color: white; font-size: 9px; font-weight: 800; white-space: nowrap; }
    .card-meta { margin: 5px 0 0; color: var(--ink-muted); font-size: 11px; line-height: 1.5; }
    .empty { padding: 28px 14px; color: var(--ink-muted); font-size: 13px; line-height: 1.7; text-align: center; }
    .marker-wrap { background: transparent; border: 0; }
    .atlas-marker {
      display: grid; width: 32px; height: 32px; place-items: center; border: 3px solid white; border-radius: 50% 50% 50% 8px;
      box-shadow: 0 5px 13px rgba(23, 50, 77, .32); color: white; transform: rotate(-45deg); transition: transform .15s ease;
    }
    .atlas-marker b { font: 800 9px/1 var(--body); text-shadow: 0 1px 2px rgba(0,0,0,.38); transform: rotate(45deg); }
    .leaflet-marker-icon:hover .atlas-marker, .leaflet-marker-icon.is-active .atlas-marker { transform: rotate(-45deg) scale(1.17); }
    .leaflet-popup-content-wrapper { border-radius: 5px; box-shadow: 0 14px 36px rgba(23,50,77,.2); }
    .leaflet-popup-content { width: min(310px, 70vw) !important; margin: 15px 17px; font-family: var(--body); }
    .popup-title { margin: 0 0 8px; color: var(--ink); font-family: var(--display); font-size: 18px; }
    .popup-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .popup-record { padding-top: 8px; border-top: 1px solid var(--line); }
    .popup-record + .popup-record { margin-top: 8px; }
    .detail { display: grid; grid-template-columns: 60px 1fr; gap: 6px; margin: 4px 0; font-size: 11px; line-height: 1.5; }
    .detail dt { color: var(--ink-muted); }
    .detail dd { margin: 0; }
    .popup-links { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .popup-links a { padding: 5px 7px; border: 1px solid var(--ink); border-radius: 3px; color: var(--ink); font-size: 10px; font-weight: 800; text-decoration: none; }
    .popup-image { width: 100%; height: 126px; margin: 0 0 10px; border-radius: 3px; object-fit: cover; }
    .legend { padding: 8px 10px; border-radius: 4px; background: rgba(255,254,250,.94); box-shadow: 0 4px 16px rgba(23,50,77,.15); color: var(--ink); font: 700 10px/1.7 var(--body); }
    .legend-row { display: flex; gap: 6px; align-items: center; }
    .legend-swatch { width: 8px; height: 18px; border-radius: 6px; }
    .map-error { position: absolute; z-index: 650; top: 24px; right: 24px; max-width: 330px; padding: 12px 14px; border: 1px solid var(--vermilion); border-radius: 4px; background: var(--white); color: var(--ink); font-size: 12px; }
    #openSidebar {
      position: absolute; z-index: 710; top: 50%; left: 12px; display: flex; align-items: center; gap: 6px;
      width: 48px; padding: 12px 0; opacity: 0; pointer-events: none; visibility: hidden; writing-mode: vertical-rl;
      transform: translate(-16px, -50%); transition: opacity var(--panel-motion), transform var(--panel-motion), visibility var(--panel-motion);
      box-shadow: 0 10px 28px rgba(23,50,77,.2);
    }
    #openSidebar span:first-child { font: 400 24px/1 var(--display); }
    [data-sidebar-mode="collapsed"] .sidebar { opacity: 0; transform: translateX(calc(-100% - 28px)); }
    [data-sidebar-mode="collapsed"] #openSidebar { opacity: 1; pointer-events: auto; visibility: visible; transform: translate(0, -50%); }
    [data-sidebar-mode="index"] .sidebar { width: min(var(--sidebar-index-width), calc(100vw - 32px)); }
    [data-sidebar-mode="index"] .masthead { padding: 13px 16px 11px 22px; }
    [data-sidebar-mode="index"] .masthead .sub { display: none; }
    [data-sidebar-mode="index"] .eyebrow { margin-bottom: 3px; }
    [data-sidebar-mode="index"] h1 { font-size: 24px; }
    [data-sidebar-mode="index"] .filter-summary-bar { display: flex; }
    [data-sidebar-mode="index"][data-filters-expanded="false"] .control-zone { max-height: 0; padding-top: 0; padding-bottom: 0; opacity: 0; }
    [data-sidebar-mode="index"] .result-card { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(180px, .75fr); gap: 16px; align-items: center; }
    [data-sidebar-mode="index"] .card-meta { margin: 0; text-align: right; }
    .leaflet-control-zoom { border: 0 !important; box-shadow: 0 5px 15px rgba(23,50,77,.18) !important; }
    .leaflet-control-zoom a { color: var(--ink) !important; background: var(--white) !important; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
    @media (max-width: 820px) {
      .sidebar { top: auto; right: 9px; bottom: 9px; left: 9px; width: auto; height: var(--sidebar-mobile-normal-height); min-height: 360px; border-radius: 7px; transform: translateY(0); }
      .leaflet-bottom { bottom: calc(48vh + 18px); }
      .masthead { padding: 14px 16px 10px 21px; }
      .eyebrow { margin-bottom: 3px; }
      h1 { font-size: 21px; }
      .sub { display: none; }
      .control-zone { padding: 10px 12px 9px 17px; }
      .stats { display: none; }
      .field-label input, .field-label select { height: 36px; }
      .rank-filters { overflow-x: auto; }
      .result-head { padding: 8px 12px 7px 17px; }
      .result-list { padding: 6px 8px 12px 13px; }
      .legend { display: none; }
      .map-error { top: 10px; right: 10px; left: 10px; max-width: none; }
      #openSidebar { top: auto; bottom: 11px; left: 50%; width: auto; padding: 0 14px; opacity: 0; writing-mode: horizontal-tb; transform: translate(-50%, 18px); }
      [data-sidebar-mode="collapsed"] .sidebar { opacity: 0; transform: translateY(calc(100% + 20px)); }
      [data-sidebar-mode="collapsed"] #openSidebar { opacity: 1; transform: translate(-50%, 0); }
      [data-sidebar-mode="collapsed"] .leaflet-bottom { bottom: 0; }
      [data-sidebar-mode="index"] .sidebar { width: auto; height: var(--sidebar-mobile-index-height); min-height: 0; }
      [data-sidebar-mode="index"] .leaflet-bottom { bottom: calc(78vh + 18px); }
      [data-sidebar-mode="index"] .result-card { display: block; }
      [data-sidebar-mode="index"] .card-meta { margin-top: 5px; text-align: left; }
    }
    @media (max-width: 440px) {
      #datasetControls { grid-template-columns: 1fr 1fr; }
      .dataset-card { min-height: 39px; padding: 6px 8px; }
      .dataset-name { font-size: 11px; }
      .dataset-count { font-size: 10px; }
      .filter-row { grid-template-columns: 1fr 1fr; }
      .rank-label { display: none; }
    }
  </style>
</head>
<body>
  <main class="app" data-source-count="232" data-sidebar-mode="normal" data-filters-expanded="true">
    <aside class="sidebar" aria-label="旅宿資料瀏覽器">
      <header class="masthead">
        <div class="masthead-top">
          <div><p class="eyebrow">RYOKAN ATLAS · JAPAN</p><h1>日本旅宿精選地圖</h1></div>
          <button id="collapseSidebar" class="icon-control" type="button" aria-label="收合側欄" title="收合側欄"><span aria-hidden="true">‹</span></button>
        </div>
        <p class="sub">將旅館 100 選與日本秘湯協會會員旅館疊合在同一張地圖，從名單、地區與溫泉地交叉探索下一站。</p>
      </header>
      <div class="filter-summary-bar">
        <div><span class="summary-kicker">目前條件</span><strong id="filterSummary">兩組名單・全部地區</strong></div>
        <button id="toggleFilters" class="summary-toggle" type="button" aria-expanded="false" aria-controls="controlZone">展開篩選</button>
      </div>
      <section id="controlZone" class="control-zone">
        <h2 id="datasetHeading" class="section-title">顯示名單</h2>
        <div id="datasetControls"></div>
        <p id="datasetNotice" class="notice" role="status" aria-live="polite"></p>
        <section id="stats" class="stats" aria-label="資料統計">
          <div class="stat"><b id="sourceCount">232</b><span>來源紀錄</span></div>
          <div class="stat"><b id="uniqueCount">—</b><span>旅館群組</span></div>
          <div class="stat"><b id="visibleCount">—</b><span>目前顯示</span></div>
        </section>
        <section class="filters" aria-label="篩選工具">
          <label class="field-label">搜尋旅館、溫泉或地址<input id="search" type="search" autocomplete="off" placeholder="例如：草津、北海道、鶴之湯" /></label>
          <div class="filter-row">
            <label class="field-label">地區<select id="region"></select></label>
            <label class="field-label">都道府縣<select id="prefecture"></select></label>
          </div>
          <div id="rankFilters" class="rank-filters" aria-label="旅館 100 選排名範圍">
            <span class="rank-label">100 選排名</span>
            <button class="active" data-rank="all">全部</button><button data-rank="top10">前 10</button><button data-rank="top30">前 30</button><button data-rank="top60">前 60</button>
          </div>
        </section>
      </section>
      <section class="results">
        <div class="result-head"><h2>旅宿索引</h2><div class="result-actions"><div id="resultSummary"></div><button id="toggleIndexMode" type="button">放大索引</button></div></div>
        <div id="list" class="result-list" aria-label="旅館清單"></div>
      </section>
    </aside>
    <button id="openSidebar" type="button" aria-label="開啟旅宿索引" aria-hidden="true"><span aria-hidden="true">›</span><span>開啟旅宿索引</span></button>
    <div id="map" role="application" aria-label="日本旅宿地圖"></div>
    <div id="mapError" class="map-error" hidden>地圖資源目前無法載入，仍可使用清單瀏覽資料。</div>
  </main>

  ["東北", ["青森縣", "岩手縣", "宮城縣", "秋田縣", "山形縣", "福島縣"]],
  ["關東・甲信越", ["茨城縣", "栃木縣", "群馬縣", "埼玉縣", "千葉縣", "東京都", "神奈川縣", "山梨縣", "長野縣", "新潟縣"]],
  ["中部・北陸", ["富山縣", "石川縣", "福井縣", "岐阜縣", "靜岡縣", "愛知縣", "三重縣"]],
  ["近畿", ["滋賀縣", "京都府", "大阪府", "兵庫縣", "奈良縣", "和歌山縣"]],
  ["中國・四國", ["鳥取縣", "島根縣", "岡山縣", "廣島縣", "山口縣", "德島縣", "香川縣", "愛媛縣", "高知縣"]],
  ["九州・沖繩", ["福岡縣", "佐賀縣", "長崎縣", "熊本縣", "大分縣", "宮崎縣", "鹿兒島縣", "沖繩縣"]],
];

function canonicalRegion(prefecture) {
  const canonical = canonicalPrefecture(prefecture);
  return regionPrefectures.find(([, prefectures]) => prefectures.includes(canonical))?.[0] ?? "";
}

function normalizeHotel100(source) {
  const prefecture = canonicalPrefecture(source.pref);
  return {
    recordId: `hotel100:${source.rank}`,
    datasetId: "hotel100",
    name: source.name ?? "",
    prefecture,
    region: canonicalRegion(prefecture) || source.region || "",
    area: source.area ?? "",
    onsen: source.area ?? "",
    lat: numberOrNull(source.lat),
    lng: numberOrNull(source.lng),
    rank: Number.isFinite(Number(source.rank)) ? Number(source.rank) : null,
    address: source.address ?? "",
    phone: source.phone ?? "",
    officialUrl: source.url ?? "",
    reservationUrl: "",
    sourceUrl: "",
    imageUrl: "",
    approximate: source.geo === "town",
  };
}

function normalizeHitou(source) {
  const prefecture = canonicalPrefecture(source.prefecture);
  return {
    recordId: `hitou:${source.id}`,
    datasetId: "hitou",
    name: source.name ?? "",
    prefecture,
    region: canonicalRegion(prefecture) || source.region || "",
    area: source.city ?? "",
    onsen: source.onsen ?? "",
    lat: numberOrNull(source.lat),
    lng: numberOrNull(source.lng),
    rank: null,
    address: source.address ?? "",
    phone: source.phone ?? "",
    officialUrl: source.officialUrl ?? "",
    reservationUrl: source.reservationUrl ?? "",
    sourceUrl: source.memberUrl ?? "",
    imageUrl: source.imageUrl ?? "",
    approximate: source.geo === "town",
  };
}

function buildNormalizedDatasets(hotels, members) {
  return [
    {
      id: "hotel100",
      label: "旅館 100 選",
      shortLabel: "100 選",
      color: "#d94f3d",
      description: "日本旅館 100 選綜合評價名單",
      records: hotels.map(normalizeHotel100),
    },
    {
      id: "hitou",
      label: "秘湯協會",
      shortLabel: "秘湯",
      color: "#247a68",
      description: "日本秘湯協會會員旅館",
      records: members.map(normalizeHitou),
    },
  ];
}

// Hotel 100 names are Traditional Chinese renderings of the Japanese names Hitou uses (鶴之湯 ↔ 鶴の湯温泉).
function normalizeName(value) {
  return String(value ?? "").normalize("NFKC").toLowerCase()
    .replace(/[\s・･·,，.。'’"“”()（）【】\[\]「」『』\-‐‑–—]/g, "")
    .replace(/之/g, "の").replace(/溫/g, "温").replace(/温泉$/, "");
}

function distanceMetres(a, b) {
  if (![a?.lat, a?.lng, b?.lat, b?.lng].every(Number.isFinite)) return Infinity;
  const radians = degrees => degrees * Math.PI / 180;
  const dLat = radians(b.lat - a.lat);
  const dLng = radians(b.lng - a.lng);
  const lat1 = radians(a.lat);
  const lat2 = radians(b.lat);
  const h = Math.sin(dLat / 2) ** 2
    + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
  return 6371000 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  })[char]);
}

function filterRecords(datasets, state) {
  const query = String(state.query ?? "").trim().normalize("NFKC").toLowerCase();
  const rankLimit = { top10: 10, top30: 30, top60: 60 }[state.rankRange] ?? Infinity;

  return datasets.flatMap(dataset => dataset.records).filter(record => {
    if (!state.enabledDatasetIds.has(record.datasetId)) return false;
    if (query) {
      const searchable = [
        record.name, record.prefecture, record.region, record.area,
        record.onsen, record.address, record.phone,
      ].join(" ").normalize("NFKC").toLowerCase();
      if (!searchable.includes(query)) return false;
    }
    if (state.region !== "all" && record.region !== state.region) return false;
    if (state.prefecture !== "all" && record.prefecture !== state.prefecture) return false;
    if (record.datasetId === "hotel100" && Number.isFinite(record.rank) && record.rank > rankLimit) return false;
    return true;
  });
}

function groupRecords(records) {
  const groups = [];
  for (const record of records) {
    const nameKey = normalizeName(record.name);
    const match = groups.find(group => (
      group.nameKey === nameKey
      && group.anchor
      && distanceMetres(group.anchor, record) <= 500
    ));
    if (match) {
      match.records.push(record);
      if (!match.datasetIds.includes(record.datasetId)) match.datasetIds.push(record.datasetId);
      const located = match.records.filter(item => Number.isFinite(item.lat) && Number.isFinite(item.lng));
      match.lat = located.reduce((sum, item) => sum + item.lat, 0) / located.length;
      match.lng = located.reduce((sum, item) => sum + item.lng, 0) / located.length;
    } else {
      const located = Number.isFinite(record.lat) && Number.isFinite(record.lng);
      groups.push({
        id: record.recordId,
        name: record.name,
        nameKey,
        datasetIds: [record.datasetId],
        records: [record],
        anchor: located ? { lat: record.lat, lng: record.lng } : null,
        lat: located ? record.lat : null,
        lng: located ? record.lng : null,
      });
    }
  }
  return groups;
}

function datasetCounts(datasets, filteredRecords) {
  const counts = new Map(datasets.map(dataset => [dataset.id, 0]));
  for (const record of filteredRecords) {
    counts.set(record.datasetId, (counts.get(record.datasetId) ?? 0) + 1);
  }
  return counts;
}

function normalizeSidebarMode(mode) {
  return ["normal", "collapsed", "index"].includes(mode) ? mode : "normal";
}

function buildFilterSummary(datasets, state) {
  const enabled = datasets.filter(dataset => state.enabledDatasetIds.has(dataset.id));
  const parts = [
    enabled.length === datasets.length
      ? "兩組名單"
      : enabled.map(dataset => dataset.label).join("＋"),
  ];
  const query = String(state.query ?? "").trim();
  if (query) parts.push(`搜尋「${query}」`);
  if (state.region !== "all") parts.push(state.region);
  if (state.prefecture !== "all" && state.prefecture !== state.region) parts.push(state.prefecture);
  if (state.rankRange !== "all") {
    parts.push({ top10: "前 10", top30: "前 30", top60: "前 60" }[state.rankRange]);
  }
  if (parts.length === 1) parts.push("全部地區");
  return parts.filter(Boolean).join("・");
}


    const DATASETS = buildNormalizedDatasets(RAW_DATA.hotel100, RAW_DATA.hitou);
    const datasetById = new Map(DATASETS.map(function(dataset) { return [dataset.id, dataset]; }));
    const state = {
      enabledDatasetIds: new Set(DATASETS.map(function(dataset) { return dataset.id; })),
      query: "", region: "all", prefecture: "all", rankRange: "all",
    };
    const $ = function(selector) { return document.querySelector(selector); };
    const elements = {
      app: $(".app"), sidebar: $(".sidebar"), datasetControls: $("#datasetControls"), datasetNotice: $("#datasetNotice"),
      uniqueCount: $("#uniqueCount"), visibleCount: $("#visibleCount"), search: $("#search"), region: $("#region"),
      prefecture: $("#prefecture"), rankFilters: $("#rankFilters"), resultSummary: $("#resultSummary"), list: $("#list"),
      mapError: $("#mapError"), controlZone: $("#controlZone"), collapseSidebar: $("#collapseSidebar"),
      openSidebar: $("#openSidebar"), toggleIndexMode: $("#toggleIndexMode"), toggleFilters: $("#toggleFilters"),
      filterSummary: $("#filterSummary"),
    };
    let map = null;
    let markerLayer = null;
    // Markers are built once per group and reused across renders; only their visibility changes.
    const markerCache = new Map();
    const visibleMarkers = new Map();
    const datasetCountEls = new Map();
    let activeGroupId = "";
    let sidebarMode = "normal";
    let filtersExpanded = true;
    let resizeTimer = 0;
    let searchTimer = 0;

    function scheduleMapResize() {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(function() {
        if (map) map.invalidateSize();
      }, window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 240);
    }

    function setFiltersExpanded(expanded) {
      filtersExpanded = sidebarMode === "normal" ? true : Boolean(expanded);
      elements.controlZone.inert = !filtersExpanded;
      elements.controlZone.setAttribute("aria-hidden", String(!filtersExpanded));
      elements.toggleFilters.setAttribute("aria-expanded", String(filtersExpanded));
      elements.toggleFilters.textContent = filtersExpanded ? "收合篩選" : "展開篩選";
      elements.app.dataset.filtersExpanded = String(filtersExpanded);
      scheduleMapResize();
    }

    function setSidebarMode(requestedMode) {
      sidebarMode = normalizeSidebarMode(requestedMode);
      elements.app.dataset.sidebarMode = sidebarMode;
      const isCollapsed = sidebarMode === "collapsed";
      elements.sidebar.inert = isCollapsed;
      elements.sidebar.setAttribute("aria-hidden", String(isCollapsed));
      elements.openSidebar.setAttribute("aria-hidden", String(!isCollapsed));
      elements.toggleIndexMode.textContent = sidebarMode === "index" ? "恢復一般" : "放大索引";
      elements.toggleIndexMode.setAttribute("aria-pressed", String(sidebarMode === "index"));
      setFiltersExpanded(sidebarMode === "normal");
    }

    function safeUrl(value) {
      try {
        const url = new URL(value);
        return url.protocol === "http:" || url.protocol === "https:" ? url.href : "";
      } catch { return ""; }
    }

    function datasetBadge(datasetId) {
      const dataset = datasetById.get(datasetId);
      return '<span class="badge" style="background:' + dataset.color + '">' + escapeHtml(dataset.shortLabel) + '</span>';
    }

    function gradientFor(datasetIds) {
      const colors = datasetIds.map(function(id) { return datasetById.get(id).color; });
      if (colors.length === 1) return colors[0];
      const step = 100 / colors.length;
      return "conic-gradient(" + colors.map(function(color, index) {
        return color + " " + (index * step) + "% " + ((index + 1) * step) + "%";
      }).join(",") + ")";
    }

    function buildDatasetControls() {
      DATASETS.forEach(function(dataset) {
        const label = document.createElement("label");
        label.className = "dataset-toggle";
        label.style.setProperty("--dataset-color", dataset.color);
        label.innerHTML = '<input type="checkbox" checked aria-label="' + escapeHtml(dataset.label) + '"><span class="dataset-card"><span class="dataset-dot"></span><span class="dataset-name">' + escapeHtml(dataset.label) + '</span><span class="dataset-count"></span></span>';
        const input = label.querySelector("input");
        input.addEventListener("change", function() {
          if (input.checked) state.enabledDatasetIds.add(dataset.id);
          else if (state.enabledDatasetIds.size === 1) {
            input.checked = true;
            elements.datasetNotice.textContent = "請至少保留一個名單。";
            window.setTimeout(function() { elements.datasetNotice.textContent = ""; }, 2200);
            return;
          } else state.enabledDatasetIds.delete(dataset.id);
          updateSelectOptions();
          render();
        });
        datasetCountEls.set(dataset.id, label.querySelector(".dataset-count"));
        elements.datasetControls.append(label);
      });
    }

    function enabledRecords() {
      return DATASETS.filter(function(dataset) { return state.enabledDatasetIds.has(dataset.id); })
        .flatMap(function(dataset) { return dataset.records; });
    }

    function uniqueSorted(values) {
      return Array.from(new Set(values.filter(Boolean))).sort(function(a, b) { return a.localeCompare(b, "zh-Hant"); });
    }

    function setOptions(select, values, allLabel, current) {
      select.innerHTML = '<option value="all">' + allLabel + '</option>' + values.map(function(value) {
        return '<option>' + escapeHtml(value) + '</option>';
      }).join("");
      select.value = values.includes(current) ? current : "all";
      return select.value;
    }

    function updateSelectOptions() {
      const records = enabledRecords();
      state.region = setOptions(elements.region, uniqueSorted(records.map(function(record) { return record.region; })), "全部地區", state.region);
      const inRegion = records.filter(function(record) { return state.region === "all" || record.region === state.region; });
      state.prefecture = setOptions(elements.prefecture, uniqueSorted(inRegion.map(function(record) { return record.prefecture; })), "全部都道府縣", state.prefecture);
      elements.rankFilters.hidden = !state.enabledDatasetIds.has("hotel100");
    }

    function mapsUrl(record) {
      const query = Number.isFinite(record.lat) ? record.lat + "," + record.lng : record.name + " " + record.address;
      return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(query);
    }

    function detailsHtml(record) {
      const details = [];
      if (record.rank) details.push(["名次", "第 " + record.rank + " 名"]);
      if (record.onsen) details.push(["溫泉地", record.onsen]);
      if (record.area && record.area !== record.onsen) details.push(["所在地", record.area]);
      if (record.address) details.push(["地址", record.address]);
      if (record.phone) details.push(["電話", record.phone]);
      if (record.approximate) details.push(["位置", "僅定位到町域，標記為約略位置"]);
      let html = '<div class="popup-record">' + datasetBadge(record.datasetId) + '<dl>';
      details.forEach(function(detail) { html += '<div class="detail"><dt>' + escapeHtml(detail[0]) + '</dt><dd>' + escapeHtml(detail[1]) + '</dd></div>'; });
      html += "</dl>";
      const links = [
        [record.officialUrl, "官方網站"], [record.reservationUrl, "預約頁"], [record.sourceUrl, "名單頁"], [mapsUrl(record), "Google 地圖"],
      ].filter(function(link) { return safeUrl(link[0]); });
      html += '<div class="popup-links">' + links.map(function(link) { return '<a href="' + escapeHtml(safeUrl(link[0])) + '" target="_blank" rel="noopener noreferrer">' + link[1] + '</a>'; }).join("") + "</div>";
      return html + "</div>";
    }

    function popupHtml(group) {
      const imageRecord = group.records.find(function(record) { return safeUrl(record.imageUrl); });
      const image = imageRecord ? '<img class="popup-image" src="' + escapeHtml(safeUrl(imageRecord.imageUrl)) + '" alt="" loading="lazy" onerror="this.hidden=true">' : "";
      return image + '<h3 class="popup-title">' + escapeHtml(group.name) + '</h3><div class="popup-badges">' + group.datasetIds.map(datasetBadge).join("") + "</div>" + group.records.map(detailsHtml).join("");
    }

    function markerIcon(group) {
      const first = group.records[0];
      const label = first.rank ? String(first.rank) : datasetById.get(first.datasetId).shortLabel.slice(0, 1);
      return L.divIcon({
        className: "marker-wrap",
        html: '<span class="atlas-marker" style="background:' + gradientFor(group.datasetIds) + '"><b>' + escapeHtml(label) + '</b></span>',
        iconSize: [34, 34], iconAnchor: [17, 31], popupAnchor: [0, -30],
      });
    }

    // A cached marker is reused only for a group with the same member records.
    function markerFor(group) {
      const key = group.records.map(function(record) { return record.recordId; }).join("|");
      let marker = markerCache.get(key);
      if (!marker) {
        marker = L.marker([group.lat, group.lng], { icon: markerIcon(group), title: group.name });
        marker.bindPopup(function() { return popupHtml(group); }, { maxWidth: 330 });
        marker.on("click", function() { activateGroup(group.id, false); });
        markerCache.set(key, marker);
      }
      return marker;
    }

    function activateGroup(groupId, fromList) {
      activeGroupId = groupId;
      elements.list.querySelectorAll(".result-card.active").forEach(function(card) { card.classList.remove("active"); });
      const card = elements.list.querySelector('[data-group-id="' + CSS.escape(groupId) + '"]');
      if (card) card.classList.add("active");
      visibleMarkers.forEach(function(marker, id) { marker.getElement()?.classList.toggle("is-active", id === groupId); });
      const marker = visibleMarkers.get(groupId);
      if (marker && fromList) { map.panTo(marker.getLatLng()); marker.openPopup(); }
      if (!fromList && card) card.scrollIntoView({ block: "nearest" });
    }

    function renderList(groups) {
      if (!groups.length) {
        elements.list.innerHTML = '<div class="empty">找不到符合條件的旅宿。<br>請調整搜尋字詞或篩選條件。</div>';
        return;
      }
      elements.list.innerHTML = groups.map(function(group) {
        const locationRecord = group.records.find(function(record) { return record.prefecture || record.onsen || record.area; }) || group.records[0];
        const location = [locationRecord.prefecture, locationRecord.onsen || locationRecord.area].filter(Boolean).join(" · ");
        const rank = group.records.find(function(record) { return record.rank; });
        const meta = [rank ? "第 " + rank.rank + " 名" : "", location, group.lat === null ? "無地圖位置" : ""].filter(Boolean).join("｜");
        return '<button type="button" class="result-card' + (activeGroupId === group.id ? " active" : "") + '" data-group-id="' + escapeHtml(group.id) + '"><div class="card-top"><h3 class="card-name">' + escapeHtml(group.name) + '</h3><span class="badges">' + group.datasetIds.map(datasetBadge).join("") + '</span></div><p class="card-meta">' + escapeHtml(meta) + "</p></button>";
      }).join("");
    }

    function renderMap(groups) {
      if (!map) return;
      const next = new Map();
      groups.forEach(function(group) {
        if (Number.isFinite(group.lat) && Number.isFinite(group.lng)) next.set(group.id, markerFor(group));
      });
      visibleMarkers.forEach(function(marker, id) { if (next.get(id) !== marker) markerLayer.removeLayer(marker); });
      next.forEach(function(marker) { if (!markerLayer.hasLayer(marker)) markerLayer.addLayer(marker); });
      visibleMarkers.clear();
      next.forEach(function(marker, id) { visibleMarkers.set(id, marker); });
      const locations = Array.from(next.values(), function(marker) { return marker.getLatLng(); });
      map.stop(); // an unfinished pan from a list click would otherwise override the new bounds
      if (locations.length > 1) map.fitBounds(locations, { padding: [48, 48], maxZoom: 11 });
      else if (locations.length === 1) map.setView(locations[0], 12);
    }

    function render() {
      const records = filterRecords(DATASETS, state);
      const groups = groupRecords(records);
      if (!groups.some(function(group) { return group.id === activeGroupId; })) activeGroupId = "";
      const counts = datasetCounts(DATASETS, records);
      datasetCountEls.forEach(function(el, id) { el.textContent = (counts.get(id) || 0) + " 筆"; });
      renderList(groups);
      renderMap(groups);
      elements.uniqueCount.textContent = groups.length;
      elements.visibleCount.textContent = records.length;
      elements.resultSummary.textContent = groups.length + " 間／" + records.length + " 筆";
      elements.filterSummary.textContent = buildFilterSummary(DATASETS, state);
    }

    function initializeMap() {
      if (!window.L) { elements.mapError.hidden = false; return; }
      map = L.map("map", { zoomControl: false }).setView([37.6, 138.2], 5);
      L.control.zoom({ position: "bottomright" }).addTo(map);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
      markerLayer = L.layerGroup().addTo(map);
      const legend = L.control({ position: "topright" });
      legend.onAdd = function() {
        const div = L.DomUtil.create("div", "legend");
        div.innerHTML = DATASETS.map(function(dataset) { return '<div class="legend-row"><i class="legend-swatch" style="background:' + dataset.color + '"></i>' + escapeHtml(dataset.label) + "</div>"; }).join("");
        return div;
      };
      legend.addTo(map);
    }

    elements.search.addEventListener("input", function(event) {
      window.clearTimeout(searchTimer);
      searchTimer = window.setTimeout(function() { state.query = event.target.value; render(); }, 180);
    });
    elements.region.addEventListener("change", function(event) { state.region = event.target.value; updateSelectOptions(); render(); });
    elements.prefecture.addEventListener("change", function(event) { state.prefecture = event.target.value; render(); });
    elements.rankFilters.addEventListener("click", function(event) {
      const button = event.target.closest("[data-rank]");
      if (!button) return;
      elements.rankFilters.querySelectorAll("[data-rank]").forEach(function(item) { item.classList.toggle("active", item === button); });
      state.rankRange = button.dataset.rank;
      render();
    });
    elements.list.addEventListener("click", function(event) {
      const card = event.target.closest(".result-card");
      if (card) activateGroup(card.dataset.groupId, true);
    });
    elements.collapseSidebar.addEventListener("click", function() { setSidebarMode("collapsed"); });
    elements.openSidebar.addEventListener("click", function() { setSidebarMode("normal"); });
    elements.toggleIndexMode.addEventListener("click", function() { setSidebarMode(sidebarMode === "index" ? "normal" : "index"); });
    elements.toggleFilters.addEventListener("click", function() { setFiltersExpanded(!filtersExpanded); });

    initializeMap();
    buildDatasetControls();
    updateSelectOptions();
    setSidebarMode("normal");
    render();
  </script>
